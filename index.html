<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="《Astra:群星计划》——月球南极联合基地策略叙事网页游戏。在有限资源下完成冰样勘测，决定人类与 AI 如何共同管理未来基地。" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%23d9d6cf'/%3E%3Ccircle cx='24' cy='26' r='5' fill='%23a9a49a'/%3E%3Ccircle cx='38' cy='40' r='7' fill='%23a9a49a'/%3E%3Cpath d='M50 8l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='%237fd8ff'/%3E%3C/svg%3E" />
    <title>Astra:群星计划</title>
  </head>
  <body>
    <div id="app">
      <div class="stage" id="scene" aria-label="三维场景"></div>
      <div class="labels" id="labels"></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="hud-top">
        <div class="hud-time" id="hud-time"></div>
        <div class="hud-res" id="hud-res" role="button" tabindex="0" aria-label="基地资源，点击查看详情"></div>
        <nav class="hud-menu" aria-label="视角与菜单">
          <div class="seg" role="group" aria-label="视角">
            <button type="button" data-view="globe" title="月球与地球空间站轨道">月球</button>
            <button type="button" data-view="overview" class="is-active" title="南极基地全景">基地</button>
            <button type="button" data-view="cutaway" title="基地核心舱剖切">剖切</button>
          </div>
          <button class="icon-btn" type="button" id="btn-help" title="玩法说明" aria-label="玩法说明">?</button>
          <button class="icon-btn" type="button" id="btn-menu" title="菜单" aria-label="菜单">≡</button>
        </nav>
      </header>

      <div class="hud-bottom">
        <button class="hud-luna" id="hud-luna" type="button" aria-label="Luna 状态"></button>
        <div class="hud-cta" id="hud-cta"></div>
        <nav class="hud-dock" aria-label="面板">
          <button type="button" data-open="act"><i>◆</i><span>行动</span></button>
          <button type="button" data-open="status"><i>▤</i><span>状态</span><em id="dock-delayed"></em></button>
          <button type="button" data-open="place"><i>⌖</i><span>地点</span></button>
          <button type="button" data-open="log"><i>☰</i><span>日志</span></button>
        </nav>
      </div>

      <aside class="drawer" id="drawer" aria-label="指挥面板" hidden>
        <div class="drawer__head">
          <div class="drawer__tabs" role="tablist">
            <button type="button" role="tab" data-tab="act">行动</button>
            <button type="button" role="tab" data-tab="status">状态</button>
            <button type="button" role="tab" data-tab="place">地点</button>
            <button type="button" role="tab" data-tab="log">日志</button>
          </div>
          <button class="icon-btn" type="button" id="drawer-close" aria-label="关闭面板">×</button>
        </div>
        <div class="drawer__body" id="drawer-body"></div>
      </aside>

      <div class="dialogue" id="dialogue" hidden></div>
      <div class="banner" id="banner" aria-live="polite"></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <noscript>本游戏需要启用 JavaScript 和 WebGL。</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
